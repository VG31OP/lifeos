version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lifeos-postgres
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
      POSTGRES_DB: lifeos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeos-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://lifeos:lifeos@postgres:5432/lifeos
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in backend/.env before starting}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-dev-nebius-api-key}
      APP_ENV: development
      NEBIUS_API_URL: ${NEBIUS_API_URL:-https://api.studio.nebius.ai/v1}
      NVIDIA_CHAT_MODEL: ${NVIDIA_CHAT_MODEL:-nvidia/Llama-3.1-Nemotron-70B-Instruct}
      NVIDIA_EMBEDDING_MODEL: ${NVIDIA_EMBEDDING_MODEL:-nvidia/NV-Embed-v2}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifeos-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
